name: Engineer acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent PDF QA readers
        run: python -m pip install --disable-pip-version-check -r scripts/qa-pdf-requirements.txt
      - name: Parse vector dimensions and render PDF independently
        run: python scripts/verify-vector-pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineer-acceptance-${{ matrix.os }}
          path: test-results/
